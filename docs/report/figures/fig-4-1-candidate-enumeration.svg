<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="700" height="360" fill="#fcfcfb"/><text x="24" y="26" text-anchor="start" font-size="11.5" font-weight="500" fill="#0b0b0b">Per-case candidates = resource combinations × feasible start slots</text><rect x="24" y="44" width="200" height="54" rx="6" fill="#cde2fb" stroke="#86b6ef" stroke-width="1"/><text x="124" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#0b0b0b">Baseline pool</text><text x="124" y="82" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52514e">2 × C(6,3) × 2 × 2 = 160</text><text x="248" y="71" text-anchor="middle" font-size="13" font-weight="400" fill="#898781">×</text><rect x="268" y="44" width="96" height="54" rx="6" fill="#cde2fb" stroke="#86b6ef" stroke-width="1"/><text x="316" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#0b0b0b">40</text><text x="316" y="82" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52514e">start slots</text><text x="386" y="71" text-anchor="middle" font-size="13" font-weight="400" fill="#898781">=</text><rect x="406" y="44" width="130" height="54" rx="6" fill="#cde2fb" stroke="#86b6ef" stroke-width="1"/><text x="471" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#0b0b0b">6 400</text><text x="548" y="76" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">tractable</text><rect x="24" y="120" width="200" height="54" rx="6" fill="#fcebeb" stroke="#e34948" stroke-width="1"/><text x="124" y="141" text-anchor="middle" font-size="11" font-weight="500" fill="#0b0b0b">+50% capacity</text><text x="124" y="158" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52514e">3 × C(9,3) × 3 × 3 = 2 268</text><text x="248" y="147" text-anchor="middle" font-size="13" font-weight="400" fill="#898781">×</text><rect x="268" y="120" width="96" height="54" rx="6" fill="#fcebeb" stroke="#e34948" stroke-width="1"/><text x="316" y="141" text-anchor="middle" font-size="11" font-weight="500" fill="#0b0b0b">26</text><text x="316" y="158" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52514e">start slots</text><text x="386" y="147" text-anchor="middle" font-size="13" font-weight="400" fill="#898781">=</text><rect x="406" y="120" width="130" height="54" rx="6" fill="#fcebeb" stroke="#e34948" stroke-width="1"/><text x="471" y="152" text-anchor="middle" font-size="13" font-weight="500" fill="#0b0b0b">≈ 59 000</text><text x="548" y="152" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">≈1.5M booleans — UNKNOWN</text><rect x="24" y="196" width="200" height="54" rx="6" fill="#eaf3de" stroke="#008300" stroke-width="1"/><text x="124" y="217" text-anchor="middle" font-size="11" font-weight="500" fill="#0b0b0b">After restriction</text><text x="124" y="234" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52514e">2 highest-scoring per slot</text><text x="248" y="223" text-anchor="middle" font-size="13" font-weight="400" fill="#898781">×</text><rect x="268" y="196" width="96" height="54" rx="6" fill="#eaf3de" stroke="#008300" stroke-width="1"/><text x="316" y="217" text-anchor="middle" font-size="11" font-weight="500" fill="#0b0b0b">26</text><text x="316" y="234" text-anchor="middle" font-size="9.5" font-weight="400" fill="#52514e">start slots</text><text x="386" y="223" text-anchor="middle" font-size="13" font-weight="400" fill="#898781">=</text><rect x="406" y="196" width="130" height="54" rx="6" fill="#eaf3de" stroke="#008300" stroke-width="1"/><text x="471" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#0b0b0b">≤ 300</text><text x="548" y="228" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">feasible incumbent</text><text x="24" y="286" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">Growth is multiplicative in every resource pool: enlarging the nurse pool from six to nine multiplies</text><text x="24" y="301" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">C(n,3) by 4.2 and the whole combination count by 14. The redundancy removed is in the resource dimension —</text><text x="24" y="316" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">at one start time most combinations are interchangeable — so full temporal coverage is preserved. CP-SAT</text><text x="24" y="331" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">therefore optimises over a subset: OPTIMAL means optimal with respect to the restricted model.</text></svg>