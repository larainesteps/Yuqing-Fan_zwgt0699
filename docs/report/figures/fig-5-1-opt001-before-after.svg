r="middle" font-size="9.5" font-weight="400" fill="#898781">+2 h</text><line x1="304" y1="258" x2="304" y2="414" stroke="#e1e0d9" stroke-width="1"/><text x="304" y="428" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781">+4 h</text><line x1="397" y1="258" x2="397" y2="414" stroke="#e1e0d9" stroke-width="1"/><text x="397" y="428" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781">+6 h</text><line x1="490" y1="258" x2="490" y2="414" stroke="#e1e0d9" stroke-width="1"/><text x="490" y="428" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781">+8 h</text><line x1="583" y1="258" x2="583" y2="414" stroke="#e1e0d9" stroke-width="1"/><text x="583" y="428" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781">+10 h</text><line x1="676" y1="258" x2="676" y2="414" stroke="#e1e0d9" stroke-width="1"/><text x="676" y="428" text-anchor="middle" font-size="9.5" font-weight="400" fill="#898781">+12 h</text><text x="108" y="275" text-anchor="end" font-size="9.5" font-weight="400" fill="#52514e">Case 01 · EMERGENCY</text><rect x="118.0" y="263" width="139.5" height="16" rx="4" fill="#2a78d6"/><line x1="118" y1="260" x2="118" y2="282" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="2 2"/><text x="108" y="301" text-anchor="end" font-size="9.5" font-weight="400" fill="#52514e">Case 02 · URGENT</text><rect x="257.5" y="289" width="69.8" height="16" rx="4" fill="#2a78d6"/><line x1="676" y1="286" x2="676" y2="308" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="2 2"/><text x="108" y="327" text-anchor="end" font-size="9.5" font-weight="400" fill="#52514e">Case 03 · EXPEDITED</text><rect x="536.5" y="315" width="93.0" height="16" rx="4" fill="#2a78d6"/><text x="108" y="353" text-anchor="end" font-size="9.5" font-weight="400" fill="#52514e">Case 04 · ROUTINE</text><rect x="257.5" y="341" width="46.5" height="16" rx="4" fill="#2a78d6"/><text x="108" y="379" text-anchor="end" font-size="9.5" font-weight="400" fill="#52514e">Case 05 · URGENT</text><rect x="373.8" y="367" width="162.8" height="16" rx="4" fill="#2a78d6"/><line x1="397" y1="364" x2="397" y2="386" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="2 2"/><text x="108" y="405" text-anchor="end" font-size="9.5" font-weight="400" fill="#52514e">Case 06 · ROUTINE</text><rect x="327.3" y="393" width="46.5" height="16" rx="4" fill="#2a78d6"/><rect x="24" y="14" width="11" height="11" rx="3" fill="#2a78d6"/><text x="41" y="24" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">within deadline</text><rect x="146" y="14" width="11" height="11" rx="3" fill="#e34948"/><text x="163" y="24" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">deadline breached</text><line x1="290" y1="12" x2="290" y2="27" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="2 2"/><text x="298" y="24" text-anchor="start" font-size="10" font-weight="400" fill="#52514e">latest permitted start</text><text x="24" y="442" text-anchor="start" font-size="9.5" font-weight="400" fill="#898781">Two end-to-end runs over the same six-case workload profile and a 12-hour horizon. The</text><text x="24" y="455" text-anchor="start" font-size="9.5" font-weight="400" fill="#898781">runs generated fresh case identifiers, so this is the same workload structure rather than</text><text x="24" y="468" text-anchor="start" font-size="9.5" font-weight="400" fill="#898781">literally the same instance. Cases 01 and 05 breached their deadlines before the fix;</text><text x="24" y="481" text-anchor="start" font-size="9.5" font-weight="400" fill="#898781">neither does after. The failing run used the fallback engine, the passing run CP-SAT.</text></svg>